<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background rounded box -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#primary-grad)" filter="url(#subtle-shadow)"/>
  
  <!-- Inner geometric infinity link design -->
  <g transform="translate(0, 0)">
    <!-- Left loop -->
    <path d="M 176 256 C 136 216, 136 152, 184 128 C 232 104, 280 152, 336 208 L 336 208" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <!-- Right loop -->
    <path d="M 336 256 C 376 296, 376 360, 328 384 C 280 408, 232 360, 176 304 L 176 304" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Central connection node glow dots -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="14" fill="#6366F1"/>
  </g>
</svg>
