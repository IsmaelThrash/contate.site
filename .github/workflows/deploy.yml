name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      # SEC-M01: Audit de segurança bloqueante (apenas deps de produção)
      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          ls -la apps/web/dist/
          if [ ! -f apps/web/dist/index.html ]; then
            exit 1
          fi

      # SEC-B05: Deploy via SFTP (criptografado) em vez de FTP (texto plano)
      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local-dir: ./apps/web/dist/
          server-dir: /domains/contate.site/public_html/
          protocol: sftp
          dangerous-clean-slate: true
